databases:
  - name: cupcakeria-db
    databaseName: cupcakeria
    plan: free

services:
  - type: web
    name: cupcakeria
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_SENHA
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cupcakeria-db
          property: connectionString
